<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תשלום | חנות החירות</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="apple-touch-icon" href="images/logo.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="חנות החירות">
<meta property="og:title" content="תשלום | חנות החירות">
<meta property="og:image" content="https://shop.gofreeil.com/images/logo.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:url" content="https://shop.gofreeil.com/checkout">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="תשלום | חנות החירות">
<meta name="twitter:image" content="https://shop.gofreeil.com/images/logo.png">
<meta name="theme-color" content="#6366f1">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Google Analytics — נכס משותף לכל אתרי "יוצאים לחירות". ההפרדה בין
     האתרים נעשית לפי hostName, ולכן אותו מזהה משמש את כולם. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YTEG7S0H9N"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag() { dataLayer.push(arguments); }
	gtag('js', new Date());
	gtag('config', 'G-YTEG7S0H9N');
</script>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="חנות החירות"></a>
    <div style="display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:14px">
      <i class="fas fa-shield-halved" style="color:var(--accent-2)"></i> תשלום מאובטח SSL
    </div>
  </div>
</header>

<section class="page-header">
  <div class="container">
    <h1>תשלום והשלמת הזמנה</h1>
  </div>
</section>

<section class="container" style="padding-bottom:80px">
  <div class="cart-layout">
    <div>
      <form class="form-grid" id="checkoutForm" onsubmit="handleCheckout(event)" style="background:var(--bg-card);padding:32px;border-radius:20px;border:1px solid var(--border)">
        <h2 style="font-size:20px;margin-bottom:8px">פרטי משלוח</h2>
        <div class="form-row">
          <div class="form-field"><label>שם פרטי</label><input type="text" name="first_name" required></div>
          <div class="form-field"><label>שם משפחה</label><input type="text" name="last_name" required></div>
        </div>
        <div class="form-row">
          <div class="form-field"><label>אימייל</label><input type="email" name="email" required></div>
          <div class="form-field"><label>טלפון</label><input type="tel" name="phone" required></div>
        </div>
        <div class="form-field"><label>כתובת</label><input type="text" name="address" placeholder="רחוב ומספר בית" required></div>
        <div class="form-row">
          <div class="form-field"><label>עיר</label><input type="text" name="city" required></div>
          <div class="form-field"><label>מיקוד</label><input type="text" name="zip"></div>
        </div>
        <div class="form-field"><label>הערות למשלוח (אופציונלי)</label><textarea name="note" rows="2" maxlength="1000" placeholder="קומה, כניסה, שעות נוחות..."></textarea></div>

        <h2 style="font-size:20px;margin:24px 0 8px">פרטי תשלום</h2>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
          <label class="filter-option" style="padding:14px;border:2px solid var(--primary);border-radius:12px;justify-content:center"><input type="radio" name="pay" value="card" checked> <i class="fas fa-credit-card"></i> כרטיס</label>
          <label class="filter-option" style="padding:14px;border:1px solid var(--border);border-radius:12px;justify-content:center"><input type="radio" name="pay" value="paypal"> <i class="fab fa-paypal"></i> PayPal</label>
          <label class="filter-option" style="padding:14px;border:1px solid var(--border);border-radius:12px;justify-content:center"><input type="radio" name="pay" value="cash"> <i class="fas fa-money-bill-wave"></i> מזומן</label>
        </div>
        <!-- שדות הכרטיס הם דמו בלבד: ללא name, לא נשלחים לשום מקום -->
        <div class="form-field"><label>מספר כרטיס</label><input type="text" placeholder="1234 5678 9012 3456" autocomplete="off"></div>
        <div class="form-row">
          <div class="form-field"><label>תוקף</label><input type="text" placeholder="MM/YY" autocomplete="off"></div>
          <div class="form-field"><label>CVV</label><input type="text" placeholder="123" autocomplete="off"></div>
        </div>
        <p style="font-size:12px;color:var(--text-muted)">⚠️ הסליקה עדיין לא פעילה - אל תזינו פרטי כרטיס אמיתיים. ההזמנה נרשמת ונחזור אליכם לתשלום.</p>

        <div id="checkoutError" style="display:none;padding:12px 14px;border-radius:10px;background:rgba(239,68,68,0.1);color:#b91c1c;font-size:14px"></div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="checkoutBtn" style="margin-top:16px">
          <i class="fas fa-lock"></i> בצע הזמנה מאובטחת
        </button>
      </form>
      <div id="checkoutSuccess" class="sell-success" hidden>
        <i class="fas fa-circle-check"></i>
        <h2 style="font-size:26px;margin-bottom:8px">ההזמנה התקבלה!</h2>
        <p style="color:var(--text-muted);margin-bottom:6px">מספר הזמנה: <strong id="orderNumber" style="color:var(--text)"></strong></p>
        <p style="color:var(--text-muted);margin-bottom:20px">אישור נשלח לאימייל שלך. נחזור אליך לתיאום התשלום והמשלוח.</p>
        <a href="products.html" class="btn btn-primary"><i class="fas fa-shopping-bag"></i> המשך קניות</a>
      </div>
    </div>
    <div class="cart-summary">
      <h3>סיכום</h3>
      <div id="orderItems"></div>
      <div id="orderTotal"></div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>
<script src="data/products.js"></script>
<script src="js/main.js"></script>
<script>
function renderOrderSummary() {
  // מוצר מוכר שעדיין לא נטען מהשרת - נספר כ-0 עד שיגיע (productsUpdated מרענן)
  const sub = cart.reduce((s,i) => s + (products.find(p => p.id === i.id)?.price || 0) * i.qty, 0);
  const ship = sub >= 199 ? 0 : 29;
  const tot = sub + ship;

  document.getElementById('orderItems').innerHTML = cart.map(i => {
    const p = products.find(x => x.id === i.id);
    if (!p) return '';
    return `<div class="summary-row"><span>${p.name} × ${i.qty}</span><span>₪${p.price * i.qty}</span></div>`;
  }).join('') || '<p style="color:var(--text-muted);text-align:center;padding:20px">העגלה ריקה</p>';

  document.getElementById('orderTotal').innerHTML = `
    <div class="summary-row"><span>סכום ביניים</span><span>₪${sub}</span></div>
    <div class="summary-row"><span>משלוח</span><span>${ship === 0 ? 'חינם' : '₪' + ship}</span></div>
    <div class="summary-row total"><span>סה"כ</span><span class="price">₪${tot}</span></div>
  `;
}
renderOrderSummary();
document.addEventListener('productsUpdated', renderOrderSummary);

// ההזמנה נשמרת בשרת המשותף; שם נשלחות ההתראות: למנהלי החנות (תיבה + SMS + מייל),
// לכל מוכר שמוצר שלו נמכר (מייל אספקה), וללקוח (אישור).
async function handleCheckout(e) {
  e.preventDefault();
  const form = e.target;
  const err = document.getElementById('checkoutError');
  err.style.display = 'none';
  const items = cart.map(i => {
    const p = products.find(x => x.id === i.id);
    return p ? { id: p.id, name: p.name, price: p.price, qty: i.qty, emoji: p.emoji, seller_document_id: p.documentId || null } : null;
  }).filter(Boolean);
  if (!items.length) { err.textContent = 'העגלה ריקה.'; err.style.display = 'block'; return; }
  const f = Object.fromEntries(new FormData(form));
  const data = {
    customer_name: `${f.first_name} ${f.last_name}`.trim(),
    customer_email: f.email, customer_phone: f.phone,
    customer_address: f.address, customer_city: f.city, customer_zip: f.zip,
    note: f.note, payment_method: f.pay, items,
  };
  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> שולח הזמנה...';
  try {
    const r = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const json = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(json.error || 'ההזמנה נכשלה');
    cart = [];
    saveCart();
    document.getElementById('orderNumber').textContent = json.order?.order_number || '';
    form.hidden = true;
    document.getElementById('checkoutSuccess').hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('ההזמנה התקבלה! אישור נשלח לאימייל', 'fa-check-circle');
  } catch (ex) {
    err.textContent = ex.message === 'Failed to fetch' ? 'אין חיבור לשרת. נסו שוב.' : ex.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock"></i> בצע הזמנה מאובטחת';
  }
}
</script>
</body>
</html>
